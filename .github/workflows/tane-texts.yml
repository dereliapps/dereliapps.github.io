name: tane-texts
on:
  push:
    branches: [texts]
    paths: ["tane-texts/request.json", "tane-texts/harvest.py"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: python3 tane-texts/harvest.py
      - run: |
          git config user.name dereliapps
          git config user.email dereliapps@users.noreply.github.com
          git add tane-texts/out_*.json
          git commit -m "Tane metin toplama çıktısı" || echo bos
          git push
